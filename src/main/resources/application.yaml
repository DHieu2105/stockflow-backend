spring:
  application:
    name: stockflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/stockflow
    username: stockflow
    password: stockflow_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
